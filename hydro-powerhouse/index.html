<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071923">
  <title>みずのちから！ひかるタービン</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071923; }
    body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .round-button {
      position: fixed; z-index: 20; display: grid; place-items: center;
      width: clamp(48px, 9.5vmin, 68px); height: clamp(48px, 9.5vmin, 68px);
      border: 2px solid rgba(219, 246, 255, .82); border-radius: 50%;
      color: #f5fcff; background: rgba(5, 31, 43, .72);
      box-shadow: 0 5px 18px rgba(0,0,0,.28), inset 0 0 18px rgba(79,202,255,.12);
      backdrop-filter: blur(5px); font-size: clamp(22px, 4.5vmin, 34px);
      line-height: 1; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .round-button:focus-visible { outline: 4px solid #ffd56a; outline-offset: 3px; }
    #audio-toggle { top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
    .speaker-icon { position: relative; width: 30px; height: 26px; display: block; }
    .speaker-icon::before {
      content: ""; position: absolute; left: 2px; top: 7px; width: 15px; height: 13px;
      background: #f5fcff; clip-path: polygon(0 30%, 38% 30%, 100% 0, 100% 100%, 38% 70%, 0 70%);
    }
    .speaker-wave, .speaker-wave::after {
      position: absolute; content: ""; border: 3px solid transparent; border-right-color: #72dcff;
      border-radius: 50%; transform: rotate(180deg);
    }
    .speaker-wave { right: 0; top: 5px; width: 15px; height: 17px; }
    .speaker-wave::after { right: -7px; top: -6px; width: 21px; height: 23px; }
    #audio-toggle.muted .speaker-wave { opacity: 0; }
    #audio-toggle.muted .speaker-icon::after {
      content: ""; position: absolute; left: 1px; top: 12px; width: 31px; height: 4px;
      border-radius: 3px; background: #ffbd71; transform: rotate(-43deg);
      box-shadow: 0 0 7px rgba(255,189,113,.55);
    }
    #replay {
      right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
      background: rgba(7, 47, 57, .86); border-color: #ffe194;
    }
    #replay.show { opacity: 1; pointer-events: auto; }
    #loader {
      position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 45%, #11394b, #06151d 68%);
      opacity: 1; transition: opacity .55s ease; pointer-events: none;
    }
    #loader.gone { opacity: 0; }
    .loader-wheel {
      width: 76px; aspect-ratio: 1; border-radius: 50%;
      border: 12px solid #66808b; border-top-color: #63d8ff; border-right-color: #f3a74a;
      box-shadow: 0 0 28px rgba(94,216,255,.35); animation: spin 1.35s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loader-wheel { animation-duration: 3s; }
      #replay { transition-duration: .01s; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <main id="app" aria-label="水力発電所の3Dゲーム"></main>
  <button id="audio-toggle" class="round-button" type="button" aria-label="おとを けす" aria-pressed="false"><span class="speaker-icon" aria-hidden="true"><span class="speaker-wave"></span></span></button>
  <button id="replay" class="round-button" type="button" aria-label="もういちど あそぶ" aria-hidden="true">↻</button>
  <div id="loader" aria-hidden="true"><div class="loader-wheel"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
