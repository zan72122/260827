<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1013" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>水面上／水中の因果劇場</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1013'/%3E%3Cpath d='M6 9 L24 13' stroke='%23cfc7b6' stroke-width='1.4' fill='none'/%3E%3Cpath d='M24 13 L24 26' stroke='%238e9490' stroke-width='1' fill='none'/%3E%3Cpath d='M4 18 H28' stroke='%233f5a5e' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1013;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #veil {
        position: fixed;
        inset: 0;
        background: #0b1013;
        transition: opacity 900ms ease;
        pointer-events: none;
      }
      /* a wordless hint: a fingertip moving up and down */
      #tapdot {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        border: 2px solid rgba(228, 220, 205, 0.85);
        animation: lift 2600ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
        pointer-events: none;
      }
      #tapdot::after {
        content: '';
        position: absolute;
        left: 50%;
        top: -74px;
        width: 2px;
        height: 96px;
        margin-left: -1px;
        background: linear-gradient(to bottom, rgba(228, 220, 205, 0), rgba(228, 220, 205, 0.3));
      }
      @keyframes lift {
        0% { transform: translateY(34px) scale(0.9); opacity: 0; }
        18% { transform: translateY(34px) scale(1); opacity: 0.9; }
        50% { transform: translateY(-34px) scale(1); opacity: 0.9; }
        82% { transform: translateY(34px) scale(1); opacity: 0.9; }
        100% { transform: translateY(34px) scale(0.9); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="veil"><div id="tapdot"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
