<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0d0b09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Jingle Bell Flower Forge</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='11' fill='%23c9a24a'/%3E%3Crect x='13' y='3' width='6' height='6' rx='3' fill='none' stroke='%23c9a24a' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0b0908;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: none; overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 5;
        background:
          radial-gradient(120% 95% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.30) 74%, rgba(0,0,0,0.60) 100%);
        mix-blend-mode: multiply;
      }
      #grain {
        position: fixed; inset: -20%; pointer-events: none; z-index: 6; opacity: 0.05;
        background-image: var(--grain); background-size: 180px 180px;
        will-change: transform;
      }
      #boot {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: #0b0908; transition: opacity 700ms ease; 
      }
      #boot.hide { opacity: 0; pointer-events: none; }
      #boot .ring {
        width: 54px; height: 54px; border-radius: 50%;
        border: 3px solid rgba(201,162,74,0.18);
        border-top-color: rgba(201,162,74,0.85);
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="boot"><div class="ring"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
