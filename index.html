<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a0f0e" />
  <title>サンタの袋の中は、星空倉庫</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #1a0f0e;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: fixed; inset: 0; pointer-events: none;
      font-family: system-ui, sans-serif;
    }
    .picbtn {
      pointer-events: auto;
      position: absolute;
      width: 92px; height: 92px;
      border: none; border-radius: 26px;
      background: rgba(46, 22, 18, 0.82);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 0 0 3px rgba(255, 214, 150, 0.55);
      padding: 6px;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.2,1.6,.4,1);
    }
    .picbtn.show { opacity: 1; transform: scale(1); }
    .picbtn:active { transform: scale(0.92); }
    .picbtn canvas { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
