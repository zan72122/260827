<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10161b">
<title>つるつるアイスカー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='12' width='24' height='12' rx='3' fill='%234fae9b'/%3E%3Ccircle cx='9' cy='26' r='4' fill='%232e3338'/%3E%3Ccircle cx='21' cy='26' r='4' fill='%232e3338'/%3E%3Crect x='24' y='18' width='6' height='4' rx='1' fill='%23c9ced3'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#10161b;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
canvas{display:block;touch-action:none}
.btn{position:fixed;width:68px;height:68px;border-radius:50%;border:none;background:rgba(255,255,255,.86);box-shadow:0 3px 12px rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:15px;cursor:pointer}
.btn:active{transform:scale(.92)}
.btn svg{width:100%;height:100%;pointer-events:none}
#replayBtn{right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom))}
#muteBtn{left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:48px;height:48px;padding:11px}
</style>
</head>
<body>
<div id="app"></div>
<button id="replayBtn" class="btn" aria-label="もういちど">
  <svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3" stroke="#2a6d5f" stroke-width="2.6" stroke-linecap="round"/><path d="M4.2 12.6 4 17l4.2-.9z" fill="#2a6d5f"/><path d="M4.9 17.6 4.3 12l5 2.7z" fill="#2a6d5f"/></svg>
</button>
<button id="muteBtn" class="btn" aria-label="おと">
  <svg id="muteIcon" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2a6d5f"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7" stroke="#2a6d5f" stroke-width="2" stroke-linecap="round"/></svg>
</button>
<script type="module" src="/src/main.js"></script>
</body>
</html>
