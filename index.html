<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<meta name="description" content="ガラスをあつくして、ふーってして、まるいキラキラかざりを作る。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lauscha Glass Ornament Workshop</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='19' r='10' fill='%23d8464a'/><rect x='13' y='4' width='6' height='6' rx='1' fill='%23c9a24a'/></svg>">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="hint" class="hint" aria-hidden="true"></div>
    <div id="boot"><div class="ember"></div></div>
    <noscript><div id="fallback"></div></noscript>
  </div>
  <script type="module" src="./src/main.js"></script>
  <script>
    // If the module graph fails (file:// or no ES modules), show the ember-only fallback.
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target.tagName === 'SCRIPT') document.body.classList.add('failed');
    }, true);
  </script>
</body>
</html>
