<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ガラスこうぼう</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #2a2622;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; touch-action: none; }
    /* Wordless UI: color swatches for the next sheet + replay ring */
    #ui {
      position: fixed; left: 0; right: 0;
      bottom: calc(10px + env(safe-area-inset-bottom));
      display: flex; justify-content: center; align-items: center; gap: 18px;
      pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
    }
    #ui.show { opacity: 1; pointer-events: auto; }
    .swatch {
      width: 58px; height: 58px; border-radius: 14px;
      border: 3px solid rgba(255,255,255,0.75);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 0 18px rgba(255,255,255,0.25);
      -webkit-tap-highlight-color: transparent;
      transform: scale(1); transition: transform 0.15s ease;
    }
    .swatch:active { transform: scale(0.9); }
    @media (max-height: 420px) {
      .swatch { width: 46px; height: 46px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
