<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>クリスマスツリー ブルブル</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0f1418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 6 26h20z' fill='%232f5d3a'/%3E%3Crect x='14' y='25' width='4' height='5' fill='%235a3d24'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0d1116;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: none; overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #overlay { position: fixed; inset: 0; pointer-events: none; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 42%, #23303a 0%, #0d1116 78%);
        transition: opacity 700ms ease; z-index: 20;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #bootBtn {
        width: min(46vw, 34vh); height: min(46vw, 34vh);
        border: none; border-radius: 50%;
        background: radial-gradient(circle at 38% 32%, #e9f3ea 0%, #b9d3bd 44%, #6f9a79 100%);
        box-shadow: 0 0 0 clamp(6px, 2vw, 16px) rgba(215, 236, 219, 0.14),
                    0 18px 46px rgba(0, 0, 0, 0.55);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; -webkit-appearance: none; appearance: none;
        animation: pulse 2.1s ease-in-out infinite;
      }
      #bootBtn:active { transform: scale(0.96); }
      #bootBtn svg { width: 46%; height: 46%; }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 clamp(6px, 2vw, 16px) rgba(215,236,219,0.14), 0 18px 46px rgba(0,0,0,0.55); }
        50% { box-shadow: 0 0 0 clamp(14px, 4vw, 34px) rgba(215,236,219,0.06), 0 18px 46px rgba(0,0,0,0.55); }
      }
      @media (prefers-reduced-motion: reduce) { #bootBtn { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="boot">
      <button id="bootBtn" aria-label="はじめる">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 5 12 47h40z" fill="#2f5d3a" />
          <path d="M32 5 12 47h40z" fill="none" stroke="#1d3a26" stroke-width="2" />
          <rect x="27" y="45" width="10" height="13" rx="2" fill="#5a3d24" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
