<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f3ece2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light" />
    <title>くるくる、お花のバースデー</title>
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #efe7db;
        -webkit-text-size-adjust: 100%;
      }
      body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #efe7db;
        transition: opacity 420ms ease;
        z-index: 40;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .mark {
        width: 96px; height: 96px;
        border-radius: 50%;
        border: 7px solid #e2d3bd;
        border-top-color: #c98aa0;
        animation: spin 1.1s linear infinite;
      }
      #boot.failed .mark { animation: none; border-color: #d8c5ad; border-top-color: #d8c5ad; }
      #boot .msg {
        position: absolute;
        bottom: 14%;
        max-width: 78vw;
        text-align: center;
        color: #6c5a48;
        font-size: 15px;
        line-height: 1.7;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .mark { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div class="mark"></div><div class="msg" id="boot-msg"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
