<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>雪を走るベル</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#0f1622" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #0b1018;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #app { position: fixed; inset: 0; }
      canvas#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      /* ---- boot veil ---------------------------------------------------- */
      #boot {
        position: absolute; inset: 0; z-index: 40;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 45%, #23262b 0%, #0d1117 70%);
        transition: opacity 700ms ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .ring {
        width: 96px; height: 96px; border-radius: 50%;
        border: 3px solid rgba(226, 196, 138, 0.22);
        border-top-color: rgba(233, 205, 148, 0.85);
        animation: spin 1.35s cubic-bezier(.55,.15,.45,.85) infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="boot"><div class="ring"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
