<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#2b211a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>はじめてうなずく、クリスマスべこ工房</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #241c16;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      #app { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; }
      #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .layer {
        position: fixed; inset: 0; pointer-events: none;
        padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
                 max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }
      #hint {
        position: absolute; left: 50%; transform: translateX(-50%);
        top: max(12px, env(safe-area-inset-top));
        font-size: 17px; font-weight: 700; letter-spacing: .04em;
        color: #fdf3e6; text-shadow: 0 2px 6px rgba(0,0,0,.75);
        background: rgba(38,28,22,.42); border-radius: 999px;
        padding: 8px 16px; opacity: 0; transition: opacity .45s ease;
        max-width: calc(100vw - 24px); text-align: center; white-space: nowrap;
      }
      #hint.on { opacity: 1; }
      #buttons {
        position: absolute; right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        display: flex; gap: 10px; pointer-events: none;
      }
      .btn {
        pointer-events: auto; width: 56px; height: 56px; border-radius: 16px;
        border: 1px solid rgba(255,236,214,.25); background: rgba(46,34,27,.72);
        color: #fbe9d3; font-size: 24px; line-height: 1; display: none;
        align-items: center; justify-content: center; cursor: pointer;
        touch-action: manipulation; -webkit-user-select: none; user-select: none;
      }
      .btn.on { display: flex; }
      .btn:active { background: rgba(70,52,41,.85); }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #241c16; color: #f2ddc4; font-size: 16px; z-index: 5; text-align: center;
        padding: 24px; transition: opacity .5s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot b { display: block; font-size: 20px; margin-bottom: 10px; }
      #boot .err { color: #ffb9a3; font-size: 14px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="layer">
      <div id="hint"></div>
      <div id="buttons">
        <button class="btn" id="btn-sound" aria-label="おと">🔈</button>
        <button class="btn" id="btn-next" aria-label="つぎのうしさん">🐮</button>
      </div>
    </div>
    <div id="boot"><div><b>クリスマスべこ工房</b><span id="boot-msg">よみこみちゅう…</span></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
