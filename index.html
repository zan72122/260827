<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e7e2d8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="口金で白い花 — 絞り袋の口金と指の軌跡から立体クリームをつくる" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E" />
    <title>口金で白い花</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ded8cd;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: block;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #undo {
        position: absolute;
        left: calc(env(safe-area-inset-left, 0px) + 14px);
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        width: 58px;
        height: 58px;
        border: none;
        border-radius: 50%;
        padding: 0;
        background: rgba(252, 250, 245, 0.74);
        box-shadow: 0 2px 8px rgba(60, 48, 34, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 320ms ease;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        cursor: pointer;
      }
      #undo.on {
        opacity: 1;
        pointer-events: auto;
      }
      #undo:active {
        background: rgba(240, 234, 224, 0.92);
      }
      #undo svg {
        width: 30px;
        height: 30px;
        display: block;
        margin: 14px auto;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ded8cd;
        color: #7a6f5e;
        font-size: 15px;
        letter-spacing: 0.08em;
        transition: opacity 600ms ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <button id="undo" type="button" aria-label="ひとつまえにもどす">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M8.2 6.6 5.1 9.7l3.1 3.1"
          stroke="#7a6a54"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M5.4 9.7h8.1a4.9 4.9 0 0 1 0 9.8H8.9"
          stroke="#7a6a54"
          stroke-width="1.9"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <div id="boot">…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
