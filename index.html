<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>とおくへ いく おてがみ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b3138">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f4ecd9'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23b02c26' stroke-width='3'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="4歳児向け・海外あて二連押しの実3Dゲーム">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #2b3138; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #gl {
    display: block; width: 100%; height: 100%;
    touch-action: none;   /* 1本指ドラッグをブラウザに奪わせない */
  }
  /* 読み込み中: 文字を使わない小さなインジケータだけ */
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(120% 120% at 50% 40%, #3c454d 0%, #23282e 100%);
    transition: opacity .55s ease; z-index: 10;
  }
  body.ready #boot { opacity: 0; pointer-events: none; }
  #boot .dots { display: flex; gap: 14px; }
  #boot i {
    width: 14px; height: 14px; border-radius: 50%;
    background: #ffc766; display: block;
    animation: pop 1.1s ease-in-out infinite;
  }
  #boot i:nth-child(2) { animation-delay: .18s; background: #ff9a5c; }
  #boot i:nth-child(3) { animation-delay: .36s; background: #8fc4ff; }
  @keyframes pop {
    0%, 70%, 100% { transform: scale(.55); opacity: .45; }
    35% { transform: scale(1); opacity: 1; }
  }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center;
    padding: 24px; text-align: center; color: #f2e6d2; z-index: 20;
    font: 500 16px/1.7 system-ui, -apple-system, "Hiragino Sans", sans-serif;
    background: #23282e;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="boot"><div class="dots"><i></i><i></i><i></i></div></div>
  <div id="fallback"><div>WebGL を利用できませんでした。<br>別のブラウザでお試しください。</div></div>
  <script>
    // WebGL が使えない環境向けの最小限の案内
    (function () {
      try {
        var c = document.createElement('canvas');
        var ok = !!(window.WebGLRenderingContext &&
          (c.getContext('webgl2') || c.getContext('webgl')));
        if (!ok) {
          document.getElementById('fallback').style.display = 'grid';
          document.getElementById('boot').style.display = 'none';
        }
      } catch (e) {
        document.getElementById('fallback').style.display = 'grid';
      }
    })();
    window.addEventListener('error', function (e) {
      if (!document.body.classList.contains('ready')) {
        var f = document.getElementById('fallback');
        if (f && f.style.display !== 'grid' && String(e.message || '').indexOf('WebGL') >= 0) {
          f.style.display = 'grid';
        }
      }
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
