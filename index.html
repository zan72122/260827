<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9ded0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ぺったん ふうけいいん</title>
<style>
  :root { color-scheme: light; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#d9cbb8;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
    touch-action:none;
  }
  #app { position:fixed; inset:0; }
  canvas#gl { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ---- loading (no text) ---- */
  #loader {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(120% 90% at 50% 35%, #fdf7ee 0%, #e4d6c2 70%, #cdbba4 100%);
    transition:opacity .6s ease; z-index:5;
  }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader i {
    width:18px; height:18px; border-radius:50%; display:block;
    animation:bob 1s ease-in-out infinite;
  }
  #loader i:nth-child(1){ background:#e08aa6; animation-delay:0s; }
  #loader i:nth-child(2){ background:#7fb3d9; animation-delay:.14s; }
  #loader i:nth-child(3){ background:#8fc49a; animation-delay:.28s; }
  #loader i:nth-child(4){ background:#b79ad6; animation-delay:.42s; }
  @keyframes bob { 0%,100%{ transform:translateY(0) scale(.85); opacity:.55 } 45%{ transform:translateY(-16px) scale(1); opacity:1 } }

  /* ---- sound toggle (icon only) ---- */
  #sound {
    position:absolute; z-index:6;
    right:calc(env(safe-area-inset-right, 0px) + 12px);
    top:calc(env(safe-area-inset-top, 0px) + 12px);
    width:46px; height:46px; border:none; border-radius:50%;
    background:rgba(255,252,246,.62); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 2px 10px rgba(90,60,40,.18);
    display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer;
    transition:transform .15s ease, opacity .3s ease; opacity:0;
  }
  #sound.ready { opacity:1; }
  #sound:active { transform:scale(.9); }
  #sound svg { width:24px; height:24px; display:block; }
  #sound .off { display:none; }
  #sound.muted .on { display:none; }
  #sound.muted .off { display:block; }

  /* rotate hint for extreme aspect: purely graphical */
  #glow { position:absolute; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(120% 80% at 50% 0%, rgba(255,246,225,.30) 0%, rgba(255,246,225,0) 55%);
    mix-blend-mode:screen; }
  #vig { position:absolute; inset:0; pointer-events:none; z-index:3;
    box-shadow:inset 0 0 130px 30px rgba(70,45,30,.20); }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="glow"></div>
  <div id="vig"></div>
  <button id="sound" aria-label="sound">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="#7a5a44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="#e7b7a0" stroke="#7a5a44"/>
      <path d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.8a7.5 7.5 0 0 1 0 10.4"/>
    </svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#7a5a44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="#d9cfc6" stroke="#7a5a44"/>
      <path d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>
  <div id="loader"><i></i><i></i><i></i><i></i></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
