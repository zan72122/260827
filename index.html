<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ちいさな点の、その中へ</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="ガラススライドの上のちいさな点から、細胞が見えるところまで、指いっぽんでもぐっていく顕微鏡のゲーム。"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23120f16'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23e8c8d4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%234b2a63'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage-canvas" aria-label="顕微鏡のがめん"></canvas>

      <!-- Full-surface gesture layer: the whole screen is the control, far larger than 44pt. -->
      <div
        id="gesture-layer"
        role="application"
        aria-label="ゆびを うえに うごかすと ちいさくなっていく"
        tabindex="0"
      ></div>

      <button id="sound-toggle" type="button" aria-label="おと" aria-pressed="false">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <path
            d="M7 12h4l6-5v18l-6-5H7z"
            fill="currentColor"
          />
          <g id="sound-waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 11.5a6 6 0 0 1 0 9" />
            <path d="M24.5 8a11 11 0 0 1 0 16" />
          </g>
          <path id="sound-mute" d="M21 12l8 8M29 12l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <noscript>
        <p class="noscript">このゲームには JavaScript がひつようです。</p>
      </noscript>
    </div>

    <div id="boot" aria-live="polite">
      <div class="boot-lamp"></div>
    </div>

    <div id="fallback" hidden>
      <p>このブラウザでは WebGL 2 がつかえないみたいです。</p>
      <p class="small">Safari の せってい で WebGL をオンにしてみてください。</p>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
