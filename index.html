<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="HE染色シミュレーター — 1枚の標本を染め、仕上がりから操作を振り返る教材" />
    <title>HE染色シミュレーター</title>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>

      <div id="hud-top" class="hud" hidden>
        <div class="hud-row">
          <span id="hud-station" class="station"></span>
          <span id="hud-mode" class="tag"></span>
          <span class="spacer"></span>
          <span id="hud-clock" class="clock"></span>
        </div>
        <div class="hud-row sub">
          <span id="hud-jar" class="jar"></span>
          <span id="hud-ref" class="ref"></span>
        </div>
        <div id="hud-status" class="hud-row status"></div>
        <div id="hud-learn" class="hud-row learn" hidden></div>
      </div>

      <div id="hint" class="hint" hidden></div>

      <div id="hud-bottom" class="hud-bottom" hidden>
        <div class="nav">
          <button id="nav-prev" class="btn nav-btn" type="button" aria-label="前の工程へ">◀</button>
          <div id="nav-label" class="nav-label"></div>
          <button id="nav-next" class="btn nav-btn" type="button" aria-label="次の工程へ">▶</button>
        </div>
        <div class="tools">
          <button id="btn-refresh" class="btn" type="button">水を交換</button>
          <button id="btn-magnify" class="btn" type="button">学習表示</button>
          <button id="btn-protocol" class="btn" type="button">手順書</button>
          <button id="btn-menu" class="btn" type="button">メニュー</button>
        </div>
        <div id="mount-tools" class="tools" hidden></div>
      </div>

      <section id="sheet" class="sheet" hidden>
        <header class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button id="sheet-close" class="btn close" type="button" aria-label="閉じる">閉じる</button>
        </header>
        <div id="sheet-body" class="sheet-body"></div>
      </section>

      <section id="title" class="title-screen">
        <div class="title-inner">
          <h1>HE染色シミュレーター</h1>
          <p class="lead">
            正常ヒト大腸のパラフィン切片（4µm）を 1 枚だけ載せたスライドを、自分の手で H&amp;E 染色します。
            染め上がりを顕微鏡像で観察し、自分の操作履歴と照らして原因を考える教材です。
          </p>
          <div class="field">
            <div class="field-label">モード</div>
            <div class="choice" id="pick-mode">
              <button class="btn choice-btn" data-v="practice">練習モード</button>
              <button class="btn choice-btn" data-v="exam">実践モード</button>
            </div>
            <p class="note" id="mode-note"></p>
          </div>
          <div class="field">
            <div class="field-label">学習用拡大表示（肉眼では見えない変化の補助）</div>
            <div class="choice" id="pick-magnify">
              <button class="btn choice-btn" data-v="auto">自動</button>
              <button class="btn choice-btn" data-v="ondemand">必要時に開く</button>
              <button class="btn choice-btn" data-v="off">非表示</button>
            </div>
          </div>
          <div class="field">
            <div class="field-label">乱数シード（同じ値なら同じ結果になります）</div>
            <input id="seed" class="text-input" type="text" value="he-2601" inputmode="text" />
          </div>
          <button id="start" class="btn primary big" type="button">はじめる</button>
          <div id="asset-notice" class="notice"></div>
          <p class="fineprint">
            本ソフトは教材です。実作業の力量認定教材でも、臨床用の染色品質予測器でもありません。
          </p>
        </div>
      </section>

      <div id="loading" class="loading">読み込み中…</div>
      <div id="fatal" class="fatal" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
