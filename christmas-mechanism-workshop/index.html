<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120d0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <title>くるくる・ポッポ・チリン　クリスマス機構工房</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1410'/%3E%3Cpath d='M16 6l6 12H10z' fill='%23c98b4a'/%3E%3Ccircle cx='16' cy='23' r='3.4' fill='%23e8b25c'/%3E%3C/svg%3E" />
    <style>
      :root {
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0b0807;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none; user-select: none;
        touch-action: none; overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      }
      #app { position: fixed; inset: 0; }
      canvas#scene { display: block; width: 100%; height: 100%; touch-action: none; }

      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

      /* progress pips */
      #pips {
        position: absolute;
        top: calc(var(--safe-t) + 10px);
        left: calc(var(--safe-l) + 12px);
        display: flex; gap: 9px;
      }
      .pip {
        width: 46px; height: 46px; border-radius: 15px;
        background: rgba(28, 20, 15, 0.5);
        border: 2px solid rgba(190, 150, 105, 0.28);
        display: grid; place-items: center;
        transition: background .5s ease, border-color .5s ease, transform .35s ease, box-shadow .5s ease;
        backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      }
      .pip svg { width: 30px; height: 30px; display: block; }
      .pip .ink { fill: none; stroke: rgba(212, 180, 140, 0.4); stroke-width: 2.1;
        stroke-linecap: round; stroke-linejoin: round; transition: stroke .5s ease; }
      .pip .sol { fill: rgba(212, 180, 140, 0.32); transition: fill .5s ease; }
      .pip.active { border-color: rgba(240, 195, 120, 0.85); background: rgba(58, 38, 22, 0.62); }
      .pip.done { border-color: rgba(255, 186, 96, 0.9); background: rgba(86, 50, 22, 0.66);
        box-shadow: 0 0 16px rgba(255, 168, 74, 0.3); }
      .pip.done .ink { stroke: #ffcf8e; } .pip.done .sol { fill: #ffcf8e; }
      .pip.active .ink { stroke: #ffe3b6; } .pip.active .sol { fill: #ffe3b6; }
      #pips.interactive .pip { pointer-events: auto; cursor: pointer; }
      #pips.interactive .pip:active { transform: scale(0.92); }

      /* sound toggle */
      #sound {
        position: absolute;
        top: calc(var(--safe-t) + 10px);
        right: calc(var(--safe-r) + 12px);
        width: 46px; height: 46px; border-radius: 15px;
        background: rgba(28, 20, 15, 0.5);
        border: 2px solid rgba(190, 150, 105, 0.28);
        display: grid; place-items: center; pointer-events: auto; cursor: pointer;
        backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      }
      #sound:active { transform: scale(0.92); }
      #sound svg { width: 28px; height: 28px; }
      #sound path, #sound line { stroke: rgba(233, 205, 165, 0.82); stroke-width: 2.2;
        fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #sound .body { fill: rgba(233, 205, 165, 0.82); stroke: none; }
      #sound .wave { opacity: 1; transition: opacity .25s; }
      #sound .slash { opacity: 0; transition: opacity .25s; }
      #sound.muted .wave { opacity: 0; } #sound.muted .slash { opacity: 1; }

      /* ghost hand hint */
      #ghost { position: absolute; left: 0; top: 0; width: 82px; height: 82px;
        margin: -41px 0 0 -41px; opacity: 0; transition: opacity .4s ease; will-change: transform; }
      #ghost svg { width: 100%; height: 100%; overflow: visible; }

      /* start veil */
      #veil { position: fixed; inset: 0; background: #0b0807; z-index: 20;
        transition: opacity 1.1s ease; display: grid; place-items: center; }
      #veil.gone { opacity: 0; pointer-events: none; }
      #veil .spark { width: 74px; height: 74px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,190,110,.95), rgba(255,140,40,.22) 55%, transparent 72%);
        animation: breathe 2.1s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { transform: scale(.82); opacity: .55 } 50% { transform: scale(1.08); opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="scene"></canvas></div>
    <div id="hud">
      <div id="pips">
        <div class="pip" data-machine="0" role="button" aria-label="smoker">
          <svg viewBox="0 0 32 32">
            <path class="ink" d="M11 28V16.5c0-3 2.2-5 5-5s5 2 5 5V28z" />
            <circle class="sol" cx="16" cy="7.5" r="3.4" />
            <path class="ink" d="M16.6 4.6c.9-2.4 3.1-2.1 3.1-2.1" />
          </svg>
        </div>
        <div class="pip" data-machine="1" role="button" aria-label="pyramid">
          <svg viewBox="0 0 32 32">
            <path class="ink" d="M16 4v18" />
            <path class="ink" d="M6 7.5l10-3.5 10 3.5-10 3.5z" />
            <path class="ink" d="M8.5 19h15" />
            <path class="ink" d="M6 27.5h20" />
          </svg>
        </div>
        <div class="pip" data-machine="2" role="button" aria-label="chimes">
          <svg viewBox="0 0 32 32">
            <path class="ink" d="M16 3v9" />
            <path class="ink" d="M8 8l8-3 8 3-8 3z" />
            <path class="ink" d="M11 24c0-3 1.6-5 3.4-5s3.4 2 3.4 5z" />
            <path class="ink" d="M9.4 24h9.8" />
            <circle class="sol" cx="24" cy="17" r="2" />
          </svg>
        </div>
      </div>
      <div id="sound" role="button" aria-label="sound">
        <svg viewBox="0 0 32 32">
          <path class="body" d="M6 12.5h5L17 7v18l-6-5.5H6z" />
          <path class="wave" d="M21 12.4a5.2 5.2 0 0 1 0 7.2" />
          <path class="wave" d="M24.4 9.2a9.8 9.8 0 0 1 0 13.6" />
          <line class="slash" x1="21" y1="10" x2="28" y2="22" />
        </svg>
      </div>
      <div id="ghost">
        <svg viewBox="0 0 100 100">
          <g id="ghost-arrow" opacity="0">
            <path d="M50 74 L50 30" stroke="rgba(255,226,178,.92)" stroke-width="7"
                  stroke-linecap="round" fill="none" />
            <path d="M35 42 L50 25 L65 42" stroke="rgba(255,226,178,.92)" stroke-width="7"
                  stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </g>
          <g id="ghost-hand">
            <circle cx="50" cy="50" r="21" fill="rgba(255,224,175,.2)" />
            <circle cx="50" cy="50" r="21" fill="none" stroke="rgba(255,229,186,.85)" stroke-width="3.4" />
            <circle cx="50" cy="50" r="8" fill="rgba(255,235,205,.9)" />
          </g>
        </svg>
      </div>
    </div>
    <div id="veil"><div class="spark"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
